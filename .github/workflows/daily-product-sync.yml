name: Daily Meiyijia product sync

on:
  schedule:
    # 04:00 UTC = 12:00 Asia/Shanghai and Asia/Kuala_Lumpur, all year.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '执行模式（手动检查默认不上传商品）'
        type: choice
        default: dry-run
        options: [dry-run, check-myj, run]
      resolve_run_key:
        description: '仅用于恢复：日报中的待核实执行标识，如 123456:1'
        type: string
        required: false
      previous_result:
        description: '仅在核对 MYJ 导入记录后选择上次结果'
        type: choice
        default: unverified
        options: [unverified, not-imported, completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: meiyijia-daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      POSPAL_USERNAME: ${{ secrets.POSPAL_USERNAME }}
      POSPAL_PASSWORD: ${{ secrets.POSPAL_PASSWORD }}
      MYJ_ADMIN_USERNAME: ${{ secrets.MYJ_ADMIN_USERNAME }}
      MYJ_ADMIN_PASSWORD: ${{ secrets.MYJ_ADMIN_PASSWORD }}
      POSPAL_PRODUCT_URL: https://beta9.pospal.cn/Product/Manage
      MYJ_PRODUCTS_URL: https://admin.myj.info/products
      TIMEZONE: Asia/Shanghai
      POSPAL_EXPORT_MIN_ROWS: ${{ vars.POSPAL_EXPORT_MIN_ROWS || '1000' }}
      MYJ_IMPORT_MIN_SUCCESS_COUNT: ${{ vars.MYJ_IMPORT_MIN_SUCCESS_COUNT || '1000' }}
      MYJ_IMPORT_WARNING_REVIEW_THRESHOLD: ${{ vars.MYJ_IMPORT_WARNING_REVIEW_THRESHOLD || '20' }}
      CLEANUP_SUCCESS_ARTIFACTS: 'true'
      MEIYIJIA_CLOUD_SYNC_ENABLED: ${{ vars.MEIYIJIA_CLOUD_SYNC_ENABLED || 'false' }}
      MEIYIJIA_REPORT_MENTION: ${{ vars.MEIYIJIA_REPORT_MENTION || github.repository_owner }}
      SYNC_MODE: ${{ inputs.mode || 'run' }}
      RESOLVE_RUN_KEY: ${{ inputs.resolve_run_key }}
      PREVIOUS_RESULT: ${{ inputs.previous_result || 'unverified' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare and prevent duplicate imports
        id: prepare
        run: python3 .github/cloud/daily_sync.py prepare

      - name: Set up Python
        if: steps.prepare.outputs.should_run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install and check dependencies
        if: steps.prepare.outputs.should_run == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python -m pip check
          python scripts/check_skill.py
          python -m unittest discover -s .github/cloud -p 'test_*.py'

      - name: Sync or check products
        if: steps.prepare.outputs.should_run == 'true'
        run: python .github/cloud/daily_sync.py execute

      - name: Publish Chinese report and GitHub Issue notification
        if: always()
        run: python3 .github/cloud/daily_sync.py report

      - name: Retain sanitized report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meiyijia-sync-${{ github.run_id }}-${{ github.run_attempt }}
          # This repository is public. Do not publish merchant exports or screenshots.
          path: .schedule-state/cloud-report.md
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
